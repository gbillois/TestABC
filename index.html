<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<script>
// No zoom: block pinch, double-tap and double-click (iOS Safari ignores user-scalable=no).
(() => {
  const non = e => e.preventDefault(), opt = { passive: false };
  for (const t of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(t, non, opt);
  document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, opt);
  document.addEventListener("dblclick", non, opt);
  let dernier = 0; // second quick tap outside buttons/fields is a double-tap: cancel it
  document.addEventListener("touchend", e => { const now = Date.now(), t = e.target;
    if (now - dernier < 350 && e.changedTouches.length === 1 && !(t.closest && t.closest("button, a, input, textarea, select, label, [role=button]")) && !(t.nodeType === 1 && getComputedStyle(t).cursor === "pointer")) e.preventDefault();
    dernier = now; }, opt);
})();
</script>
<style>
/* no double-tap zoom; at least 16px in fields (otherwise iPhone zooms in) */
*{touch-action:manipulation}
input,textarea,select{font-size:max(16px,1em)}
</style>
<title>My little sandbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: a shelf of cartridges — each game is a clickable cartridge. */
  :root {
    --bg: #eef3fb;
    --shelf: #dbe4f3;
    --ink: #1c2240;
    --muted: #5b6488;
    --card: #ffffff;
    --accent: #ff5a3c;
    --c1: #ffc531; --c2: #1fb5a6; --c3: #3d6cf0; --c4: #ff6fa8; --c5: #8a5cf6; --c6: #ff8a2b;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a33; --shelf: #1e2648; --ink: #eef1ff; --muted: #a3abd0; --card: #232c55;
      --accent: #ff7a5e; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141a33; --shelf: #1e2648; --ink: #eef1ff; --muted: #a3abd0; --card: #232c55;
    --accent: #ff7a5e; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 2.5rem 3rem;
  }
  .wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 2rem; }

  header { display: grid; gap: .5rem; }
  .eyebrow {
    font-weight: 800; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1; margin: 0;
    text-wrap: balance;
  }
  h1 .name { color: var(--accent); }
  h1 .dots { display: inline-flex; gap: .15em; margin-left: .2em; vertical-align: middle; }
  h1 .dots i { width: .22em; height: .22em; border-radius: 50%; display: block; }
  h1 .dots i:nth-child(1) { background: var(--c1); }
  h1 .dots i:nth-child(2) { background: var(--c2); }
  h1 .dots i:nth-child(3) { background: var(--c3); }
  .lead { margin: 0; color: var(--muted); font-size: 1.1rem; max-width: 60ch; }
  .count { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--ink); }

  .shelf {
    background: var(--shelf); border-radius: 18px;
    padding: 1.25rem;
    display: grid; gap: 1.25rem;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }

  /* Cartridge */
  .cart {
    --c: var(--c3);
    position: relative; display: flex; flex-direction: column;
    text-decoration: none; color: var(--ink);
    background: var(--c);
    border-radius: 14px 14px 8px 8px;
    padding: 14px 12px 12px;
    min-height: 230px; min-width: 0;
    box-shadow: 0 6px 0 rgba(0,0,0,.18);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .cart::before { /* top notches */
    content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    width: 40%; height: 4px; border-radius: 2px; background: rgba(0,0,0,.18);
  }
  .cart .label {
    flex: 1; margin-top: 10px;
    background: var(--card); border-radius: 8px; padding: 14px;
    display: flex; flex-direction: column; gap: .5rem;
  }
  .cart .icon { font-size: 2.4rem; line-height: 1; }
  .cart .icon img:not(.poster) { display: block; width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .cart h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0; text-wrap: balance; }
  .cart p { margin: 0; color: var(--muted); font-size: .92rem; }
  .cart .play {
    margin-top: auto; align-self: flex-start;
    font-weight: 800; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase;
    background: var(--ink); color: var(--bg); padding: .45rem .8rem; border-radius: 999px;
  }
  .cart .ridges { display: flex; gap: 4px; justify-content: center; margin-top: 10px; }
  .cart .ridges i { width: 10px; height: 6px; border-radius: 2px; background: rgba(0,0,0,.2); display: block; }
  a.cart:hover, a.cart:focus-visible { transform: translateY(-4px); box-shadow: 0 10px 0 rgba(0,0,0,.18); }
  a.cart:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  a.cart:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }

  /* Empty slot */
  .slot {
    min-height: 230px; border-radius: 14px 14px 8px 8px;
    border: 3px dashed color-mix(in srgb, var(--muted) 45%, transparent);
    display: grid; place-items: center; text-align: center; padding: 1rem;
    color: var(--muted); font-weight: 700;
  }
  .slot span { display: block; font-family: var(--display); font-weight: 400; font-size: 2rem; opacity: .5; }

  /* Topics */
  .topic { display: grid; gap: .75rem; scroll-margin-top: 16px; }
  .topic-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; }
  .topic-head h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 4vw, 2rem); margin: 0; }
  .topic-head h2 span { margin-right: .35em; }
  .topic-head a { color: var(--accent); font-weight: 800; text-decoration: none; }
  .topic-head a:hover { text-decoration: underline; }
  .topic > p { margin: 0; color: var(--muted); max-width: 70ch; }
  .toc { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
  .toc a { text-decoration: none; color: var(--ink); background: var(--shelf); font-weight: 800; padding: .4rem .8rem; border-radius: 999px; }
  .toc a:hover, .toc a:focus-visible { background: var(--card); }
  .cart .poster { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: var(--shelf); }

  footer { color: var(--muted); font-size: .9rem; }

  @media (prefers-reduced-motion: reduce) {
    .cart { transition: none; }
    a.cart:hover, a.cart:focus-visible, a.cart:active { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Test bench · one shelf per topic</div>
    <h1>My little <span class="name">sandbox</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></h1>
    <p class="lead">Pick a cartridge to open a project. <span class="count" id="count"></span></p>
    <nav class="toc" id="toc" aria-label="Topics"></nav>
  </header>

  <main id="topics"></main>

  <footer>Every new project shows up here with its own button: add it to the <code>TOPICS</code> list at the bottom of this page.</footer>
</div>

<script>
  // Topics: one shelf each. Add one entry per new project.
  // color: c1 yellow, c2 teal, c3 blue, c4 pink, c5 purple, c6 orange
  // poster (optional): a 16:9 image shown on the cartridge label; otherwise the icon is shown.
  const TOPICS = [
    {
      id: "games", name: "Games", icon: "🕹️",
      description: "Small self-contained games.",
      items: [
        { title: "Breakout", description: "Bounce the ball with your paddle and smash every brick, with power-ups falling from broken bricks!", icon: "🧱", poster: "assets/posters/breakout.jpg", file: "breakout.html", color: "c4" },
        { title: "The Last Page", description: "A platformer made from ChetasLua's anime short: the little fox climbs the waking library, rides paper birds to the sunrise and finds the last blank page.", icon: "🦊", poster: "assets/posters/last-page.jpg", file: "last-page/", color: "c6" },
      ],
    },
    {
      id: "adventures", name: "3D adventures", icon: "🐉",
      description: "Worlds to explore in 3D and 2.5D, brought over from the ABCDEMO game room. In-game text is in French.",
      items: [
        { title: "Les Pics du Dragon", description: "You are the red dragon! Fly freely over the peaks, maple trees and temples, and relight the 6 great lanterns with your fire.", icon: "🐉", file: "pics-dragon/", color: "c1" },
        { title: "La Balade de Millépoques", description: "Walk through a Millépoques village in 2.5D: the town hall, the cathedral, the river and its boats…", icon: "🏘️", file: "balade/", color: "c4" },
        { title: "Le Village de Millépoques", description: "A Millépoques village in real 3D: stroll between the houses, meet the villagers and step into the workshops to see how they work.", icon: "🏡", file: "village/", color: "c6" },
        { title: "Les Trois Lueurs", description: "A pixel-art adventure in 3D: find the three lights in the meadows, the ochre gorges and the misty marsh, and relight the Great Lantern.", icon: "🏮", file: "lueurs/", color: "c5" },
        { title: "Panda Fighter", description: "You are the samurai panda! Climb the rock and the tower ladder to find your sabre and your fan, train on the scarecrow… and dance!", icon: "🐼", file: "jeux/panda-fighter.html", color: "c2" },
        { title: "Panda Fighter: le Dojo", description: "The samurai panda trains at the dojo at sunset, then leaves through the torii to explore the valley: stone path, lanterns, pond and pavilion, pine woods. Keyboard or gamepad.", icon: "🥋", file: "panda-dojo/", color: "c3" },
        { title: "Panda Fighter: le Dojo (manga)", description: "The same dojo and valley, inked live like a manga page: screentone, ink lines, speed lines, sound effects. Y switches style.", icon: "🖋️", file: "panda-dojo/?style=manga", color: "c6" },
        { title: "La Ville du Pélican", description: "Walk around the town from the film “The Tea Ride”: market, lanterns, animals, the quay and the lake, while the giant pelican and its rider ride from dawn to night.", icon: "🦢", file: "jeux/la-ville-du-pelican.html", color: "c4" },
        { title: "Le Gardien de Mousse", description: "A short animated film by ChetasLua (1 min 20): at sunrise, a moss-covered giant wakes up in the forest and flies away.", icon: "🎬", file: "jeux/moss-keeper.html", color: "c2" },
      ],
    },
    {
      id: "cyber", name: "The Cyber Book", icon: "📖",
      description: "The Wavestone CISO radar (Radar du RSSI), staged as books and concept boards. Pages in French.",
      items: [
        { title: "The Cyber Book", description: "The sixteen published radar editions, 2011 to 2026, as a page-turning book: click a dial for its keywords, follow a keyword across the years.", icon: "📖", file: "cyber-book/index.html", color: "c5" },
        { title: "The Cyber Book: night edition", description: "Another take: ten years of cybersecurity, 2018 → 2027, on a night stage with an upright radar, version selector and decade insights.", icon: "🌌", file: "radar-rssi/index.html", color: "c3" },
        { title: "Radar concepts", description: "Six ways to stage the CISO radar: a concept board, including the upright book with page turns and clickable themes.", icon: "🎯", file: "radar-concepts/index.html", color: "c2" },
      ],
    },
    {
      id: "video", name: "Video Lab", icon: "🎬", menu: "videos/index.html",
      description: "Motion design made in code (Canvas 2D + Web Audio), played live in the browser and exportable as MP4.",
      items: [
        { title: "AO // Character Reveal", description: "Explosive streetwear title sequence: giant kinetic type, split-screens, shatters and strobe around the AO character.", icon: "🎬", poster: "videos/01-ao-reveal/poster.jpg", file: "videos/01-ao-reveal/index.html", color: "c6" },
        { title: "AO // Reveal Trailer v2", description: "Second version: posable vector rig, frame-by-frame navigation, per-shot timeline and shot list.", icon: "🎞️", poster: "videos/02-ao-reveal-trailer/poster.jpg", file: "videos/02-ao-reveal-trailer/index.html", color: "c1" },
      ],
    },
    {
      id: "slides", name: "Slide Lab", icon: "🖼️", menu: "slides/index.html",
      description: "Create, edit, present and export HTML presentations. External repos, audited before use (see each AUDIT.md).",
      items: [
        { title: "HTML Presentation Editor", description: "Offline PowerPoint-style editor in one HTML file: ribbon, thumbnails, tables, charts, presenter mode, .pptx export.", icon: "🖼️", poster: "slides/01-html-presentation-editor/poster.jpg", file: "slides/01-html-presentation-editor/index.html", color: "c2" },
        { title: "Bento Slides", description: "Deck, player and editor in a single self-saving .bento.html: morph, charts, AI-editable JSON document.", icon: "🍱", poster: "slides/02-bento-slides/poster.jpg", file: "slides/02-bento-slides/index.html", color: "c4" },
      ],
    },
  ];

  const root = document.getElementById("topics");
  const toc = document.getElementById("toc");
  const count = document.getElementById("count");

  function cartridge(item) {
    const a = document.createElement("a");
    a.className = "cart";
    a.href = item.file;
    a.style.setProperty("--c", `var(--${item.color || "c3"})`);
    a.innerHTML = `
      <div class="label">
        <div class="icon" aria-hidden="true"></div>
        <h2></h2>
        <p></p>
        <span class="play">Open ▸</span>
      </div>
      <div class="ridges" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>`;
    const icon = a.querySelector(".icon");
    if (item.poster) { const im = document.createElement("img"); im.className = "poster"; im.src = item.poster; im.alt = ""; im.loading = "lazy"; im.onerror = () => { im.remove(); icon.textContent = item.icon || "🎮"; }; icon.append(im); }
    else icon.textContent = item.icon || "🎮";
    a.querySelector("h2").textContent = item.title;
    a.querySelector("p").textContent = item.description || "";
    return a;
  }

  for (const topic of TOPICS) {
    const sec = document.createElement("section");
    sec.className = "topic"; sec.id = topic.id;
    sec.innerHTML = `<div class="topic-head"><h2><span aria-hidden="true"></span></h2></div><p></p><div class="shelf"></div>`;
    sec.querySelector("h2 span").textContent = topic.icon || "";
    sec.querySelector("h2").append(topic.name);
    if (topic.menu) { const m = document.createElement("a"); m.href = topic.menu; m.textContent = `Open the ${topic.name} →`; sec.querySelector(".topic-head").append(m); }
    sec.querySelector("p").textContent = topic.description || "";
    const shelf = sec.querySelector(".shelf");
    shelf.setAttribute("aria-label", topic.name);
    for (const item of topic.items) shelf.append(cartridge(item));
    const s = document.createElement("div");
    s.className = "slot";
    s.innerHTML = `<div><span>+</span>Free slot<br>for the next one</div>`;
    shelf.append(s);
    root.append(sec);

    const t = document.createElement("a");
    t.href = "#" + topic.id; t.textContent = `${topic.icon || ""} ${topic.name}`;
    toc.append(t);
  }

  const n = TOPICS.reduce((k, t) => k + t.items.length, 0);
  count.textContent = `${n} project${n > 1 ? "s" : ""} in ${TOPICS.length} topic${TOPICS.length > 1 ? "s" : ""}.`;
</script>
<script>
// Gamepad support: in menus, the stick or d-pad picks a button, A presses it, B goes back.
window.MANETTE = { toujoursMenu: true };
(() => {
  const C = window.MANETTE, st = { prec: [], dir: "", rep: 0, focus: null, tenues: new Set(), roule: false };
  const css = document.createElement("style"); css.textContent = ".gp-focus{outline:4px solid #ffc93c!important;outline-offset:3px;box-shadow:0 0 0 7px rgba(255,255,255,.85)!important}"; document.head.append(css);
  const NOMS = { Space: " ", Enter: "Enter", Escape: "Escape", ShiftLeft: "Shift", Tab: "Tab" };
  const touche = (code, bas) => { if (bas === st.tenues.has(code)) return; bas ? st.tenues.add(code) : st.tenues.delete(code);
    const key = NOMS[code] ?? (code.startsWith("Key") ? code.slice(3).toLowerCase() : code);
    document.dispatchEvent(new KeyboardEvent(bas ? "keydown" : "keyup", { key, code, bubbles: true, cancelable: true })); };
  const lacher = () => { for (const c of [...st.tenues]) touche(c, false); };
  const visible = el => { if (!el.getClientRects().length) return false; const s = getComputedStyle(el); return s.visibility !== "hidden" && +s.opacity > .1 && s.pointerEvents !== "none"; };
  const menuOuvert = () => { if (C.toujoursMenu) return document.body; const v = [...document.querySelectorAll(C.menus || ".overlay, .screen")].filter(o => !o.hidden && visible(o)); return v[v.length - 1] || null; };
  const boutons = o => [...o.querySelectorAll("button, a[href], input, select, [role=button]")].filter(b => !b.disabled && visible(b));
  const poser = b => { st.focus?.classList.remove("gp-focus"); st.focus = b; if (b) { b.classList.add("gp-focus"); b.scrollIntoView?.({ block: "nearest", inline: "nearest" }); } };
  const bouger = (o, dx, dy) => { const L = boutons(o); if (!L.length) return; const cur = L.includes(st.focus) ? st.focus : null;
    if (!cur) { poser(L.find(b => /\b(play|start|resume|continue|jouer|c'est parti|commencer|reprendre|continuer)/i.test(b.textContent)) || L[0]); return; }
    const r = cur.getBoundingClientRect(), cx = r.x + r.width / 2, cy = r.y + r.height / 2; let best = null, bs = 1e9;
    for (const b of L) { if (b === cur) continue; const q = b.getBoundingClientRect(), x = q.x + q.width / 2 - cx, y = q.y + q.height / 2 - cy, av = x * dx + y * dy;
      if (av <= 4) continue; const sc = av + Math.abs(x * dy - y * dx) * 2.5; if (sc < bs) { bs = sc; best = b; } }
    if (best) poser(best); };
  const cliquer = sel => { for (const s of sel) { const b = document.querySelector(s); if (b && !b.hidden && visible(b)) { b.click(); return true; } } return false; };
  // a gamepad button in game: a held key (string) or an on-screen button to click (list)
  const agir = (m, bas, appui) => { if (!m) return; if (typeof m === "string") touche(m, bas); else if (appui) cliquer(m); };
  const message = t => { const d = document.createElement("div"); d.textContent = t; d.style.cssText = "position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99999;background:#1d3b2a;color:#fff;font:700 16px system-ui,sans-serif;padding:8px 16px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.3);pointer-events:none";
    document.body.append(d); setTimeout(() => d.remove(), 3500); };
  function tour() {
    const g = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(p => p && p.connected);
    if (!g) { if (st.roule) { lacher(); poser(null); st.roule = false; } return; }
    requestAnimationFrame(tour);
    const now = performance.now(), B = i => !!g.buttons[i]?.pressed, appui = i => B(i) && !st.prec[i], ax = i => { const v = g.axes[i] ?? 0; return Math.abs(v) < .25 ? 0 : v; };
    const mx = Math.max(-1, Math.min(1, ax(0) + (B(15) ? 1 : 0) - (B(14) ? 1 : 0))), my = Math.max(-1, Math.min(1, ax(1) + (B(13) ? 1 : 0) - (B(12) ? 1 : 0)));
    const o = menuOuvert();
    if (o) {
      lacher(); if (st.focus && !o.contains(st.focus)) poser(null);
      const dir = Math.max(Math.abs(mx), Math.abs(my)) > .5 ? (Math.abs(mx) > Math.abs(my) ? (mx > 0 ? "d" : "g") : (my > 0 ? "b" : "h")) : "";
      if (dir && (dir !== st.dir || now > st.rep)) { bouger(o, dir === "d" ? 1 : dir === "g" ? -1 : 0, dir === "b" ? 1 : dir === "h" ? -1 : 0); st.rep = now + (dir !== st.dir ? 400 : 170); }
      st.dir = dir;
      if (appui(0)) { if (!st.focus) bouger(o, 0, 0); else if (st.focus.matches("input, select")) st.focus.focus(); else st.focus.click(); }
      if (appui(9) && !(C.start && cliquer(C.start))) { const b = boutons(o).find(b => /\b(play|start|resume|continue|jouer|c'est parti|commencer|reprendre|continuer)/i.test(b.textContent)); b?.click(); }
      if (appui(1)) { const b = boutons(o).find(b => b.matches("button") && /close|back|resume|cancel|fermer|retour|reprendre|continuer|annuler|^ok$|✖|❌/i.test(b.textContent.trim())); if (b) b.click(); else { touche("Escape", true); touche("Escape", false); } }
    } else {
      if (st.focus) poser(null); st.dir = "";
      touche("ArrowLeft", mx < -.45); touche("ArrowRight", mx > .45); touche("ArrowUp", my < -.45); touche("ArrowDown", my > .45);
      const map = [[0, C.A], [1, C.B], [2, C.X], [3, C.Y], [9, C.start], [8, C.select]];
      for (const [i, m] of map) agir(m, B(i), appui(i));
      if (C.courir) touche(C.courir, B(4) || B(5) || B(6) || B(7));
    }
    st.prec = g.buttons.map(b => b.pressed);
  }
  const lancer = () => { if (!st.roule) { st.roule = true; requestAnimationFrame(tour); } };
  addEventListener("gamepadconnected", () => { message("🎮 Gamepad connected!"); lancer(); });
  addEventListener("gamepaddisconnected", () => { lacher(); poser(null); });
  if ([...(navigator.getGamepads ? navigator.getGamepads() : [])].some(p => p && p.connected)) lancer();
})();
</script>
</body>
</html>
